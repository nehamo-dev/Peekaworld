<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Peekaworld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,100;1,9..144,400..700,100&display=swap">
<style>
/* Layout: full-bleed pastel atlas in a misty frame; soft frosted panels float in the corners.
   One light look on purpose (a picture-book map), so no dark-mode variant. */
:root{
  color-scheme: light;
  --mist:#e9f1f5;
  --ocean:#c6e3f2;
  --ocean-ink:#5d8fae;
  --ink:#36405a;
  --muted:#7d869c;
  --paper:#ffffff;
  --butter:#fbe7a6;
  --rose:#f5c6d6;
  --rose-ink:#c9607f;
  --mint:#c5e8c8;
  --display:"Fraunces","Iowan Old Style","Palatino",Georgia,serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --shadow:0 14px 34px -14px rgba(54,64,90,.28),0 2px 6px rgba(54,64,90,.06);
  --line:rgba(54,64,90,.08);
  --gut:16px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--mist)}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
body{transition:background-color .5s}
body[data-view="space"]{background:#0c0a26}
#galaxy{position:absolute;inset:0;width:100%;height:100%;display:none}
body[data-view="space"] #galaxy{display:block}
.view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--rose-ink);outline-offset:3px}
.disp{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 72}

/* soft panels */
.panel{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);box-shadow:0 2px 8px -2px rgba(54,64,90,.14);padding:10px 18px;font-family:var(--body);font-weight:600;font-size:16px;cursor:pointer;min-height:46px;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{box-shadow:0 6px 16px -6px rgba(54,64,90,.25)}
.btn:active{transform:scale(.97)}
.btn.butter{background:var(--butter);border-color:transparent}
.btn.rose{background:var(--rose);border-color:transparent}
.btn svg{width:20px;height:20px;flex:none}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gut) 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 10px;border-radius:999px;flex-wrap:wrap}
.brand svg{width:36px;height:36px;flex:none}
.brand h1{margin:0;font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 72;font-weight:600;font-size:25px;line-height:1;letter-spacing:-.01em}
.brand h1 em{color:var(--rose-ink);font-weight:500}
.tabs{display:flex;gap:2px;margin-left:6px;padding:3px;border-radius:999px;background:#eef2f6}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:999px;padding:7px 14px 7px 10px;font-weight:650;font-size:14.5px;color:var(--muted);cursor:pointer;min-height:38px;transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 5px rgba(54,64,90,.16)}
.tabs svg{width:20px;height:20px;flex:none}
.right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.layers{display:flex;gap:4px;flex-wrap:wrap;padding:5px;border-radius:999px}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px 14px 7px 9px;background:transparent;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;min-height:40px;transition:background .18s,color .18s}
.chip[aria-pressed="true"]{background:var(--chipbg);color:var(--ink)}
.chip i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--dot);display:block;flex:none;transition:background .18s}
.chip[aria-pressed="true"] i{background:var(--dot)}

/* zoom controls */
.zoom{position:absolute;right:var(--gut);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.zoom button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .12s}
.zoom button:active{transform:scale(.94)}
.zoom svg{width:22px;height:22px}
.zoom #zback{background:var(--butter)}

/* info card */
.card{position:absolute;left:var(--gut);bottom:calc(env(safe-area-inset-bottom,0px) + var(--gut));width:min(420px,calc(100% - 2*var(--gut) - 68px));padding:20px 22px 18px;border-radius:26px;animation:rise .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.card .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:#f1f3f7;cursor:pointer;display:grid;place-items:center;padding:0}
.card .x svg{width:14px;height:14px}
.card-top{display:flex;gap:16px;align-items:center;padding-right:40px}
.flag{font-size:46px;line-height:1;flex:none;width:72px;height:72px;display:grid;place-items:center;border-radius:20px;background:var(--flagbg,#eef4f8)}
.flag svg{width:38px;height:38px}
.flag img{width:52px;height:39px;object-fit:cover;border-radius:5px;box-shadow:0 0 0 1px rgba(54,64,90,.12),0 3px 8px -2px rgba(54,64,90,.25)}
.ask .gflag img{width:40px;height:30px;object-fit:cover;border-radius:4px;vertical-align:-5px;box-shadow:0 0 0 1px rgba(54,64,90,.12),0 2px 6px -2px rgba(54,64,90,.25)}
.flag-edge{fill:none;stroke:rgba(54,64,90,.22);stroke-width:1}
.lbl image{filter:drop-shadow(0 1px 1.5px rgba(54,64,90,.25))}
.kind{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card h2{margin:3px 0 0;font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 72;font-weight:600;font-size:32px;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0 0;font-size:16px}
.rows dt{color:var(--muted);font-weight:500}
.rows dd{margin:0;font-weight:650;min-width:0}
.fact{margin:14px 0 0;padding:13px 16px;border-radius:16px;background:#fdf6e2;font-size:16.5px;line-height:1.45;font-weight:500}
.fact b{display:block;font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 24;font-style:italic;font-weight:500;font-size:15px;color:#a8853a;margin-bottom:3px}
.card-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.card .found{font-family:var(--display);font-variation-settings:"SOFT" 100;font-style:italic;font-weight:600;color:#4f9a6b;font-size:19px;margin:0 0 10px}

/* game banner */
.game{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);width:min(540px,calc(100% - 2*var(--gut) - 68px));padding:14px 18px 16px;text-align:center;border-radius:26px}
.modes{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#eef2f6}
.modes button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:34px;transition:background .15s,color .15s}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(54,64,90,.15)}
.ask{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 72;font-weight:600;font-size:30px;letter-spacing:-.01em;margin:12px 0;line-height:1.15;text-wrap:balance}
.ask .gflag{font-size:30px;vertical-align:-3px;margin-right:8px}
.ask .gflag svg{width:36px;height:36px;vertical-align:-10px}
.ask b{font-weight:600;font-style:italic;color:var(--rose-ink)}
.gbar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.stars{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:18px;padding:0 16px;min-height:46px;border-radius:999px;background:var(--butter);font-variant-numeric:tabular-nums}
.stars svg{width:18px;height:18px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(calc(-50% - 8px))}40%,80%{transform:translateX(calc(-50% + 8px))}}

.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);padding:13px 24px;border-radius:999px;font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:600;font-size:20px;white-space:nowrap;max-width:calc(100% - 2*var(--gut));overflow:hidden;text-overflow:ellipsis;animation:rise .25s ease-out}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:24px;color:var(--ocean-ink)}

/* map styles */
.country{stroke:#fff;stroke-width:1;stroke-opacity:.95;vector-effect:non-scaling-stroke;cursor:pointer;transition:filter .2s}
.state{stroke:#fff;stroke-width:1;stroke-opacity:.95;vector-effect:non-scaling-stroke;cursor:pointer}
.country.sel,.state.sel{stroke:var(--ink);stroke-width:2;stroke-opacity:.85;filter:saturate(1.5) brightness(1.02)}
.hint{animation:hint .7s ease-in-out 5}
@keyframes hint{50%{fill:#ffd86b;stroke:var(--ink);stroke-width:2.5}}
.ocean{fill:var(--ocean);cursor:pointer}
.grat{fill:none;stroke:#fff;stroke-opacity:.45;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.sphere-edge{fill:none;stroke:#fff;stroke-width:3;stroke-opacity:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.lbl text{font-family:var(--body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.lbl.ocean-l text{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 36;font-style:italic;font-weight:500;fill:var(--ocean-ink);stroke:rgba(255,255,255,.55);letter-spacing:.06em}
.lbl.sea-l text{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 18;font-style:italic;font-weight:500;fill:var(--ocean-ink);stroke:rgba(255,255,255,.5)}
.lbl.cont-l text{font-weight:700;letter-spacing:.24em;text-transform:uppercase;fill:#4c5671;stroke:rgba(255,255,255,.7);stroke-width:4px}
.lbl.state-l text{fill:#4a6b56;font-weight:600}
.tap{cursor:pointer}
.tap text{pointer-events:auto}
.city circle{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.city path{fill:#f2a3ba;stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.city text{font-weight:600}
.ripple{fill:none;stroke:#fff;stroke-width:3;pointer-events:none}
.hint-ring{fill:none;stroke:#ffd86b;stroke-width:5;pointer-events:none}

.tip{position:absolute;pointer-events:none;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;transform:translate(-50%,-150%)}
@media (hover:hover){.country:hover,.state:hover{filter:saturate(1.35) brightness(1.02)}}
.lbl.usa-l text{fill:#4c5671;font-weight:650}
.lbl.cap-l path{fill:#f2a3ba;stroke:#fff;stroke-width:1.5}
.lbl.cap-l text{font-weight:600;fill:#5a6178}
.lbl.dc-l path{fill:#f08aa8}
.lbl.space-l text{fill:#f1edff;stroke:rgba(12,10,38,.85);stroke-width:3.5px;font-weight:600}
.lbl.belt-l text{font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 18;font-style:italic;font-weight:500;fill:#d8cdfa;stroke:rgba(12,10,38,.7)}
.orbit{fill:none;stroke:#cdbfff;stroke-opacity:.22;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.orbit.comet{stroke:#a9d4ff;stroke-dasharray:3 6;stroke-opacity:.28}
.moon-orbit{stroke-opacity:.1}
.body{cursor:pointer}
.sel-ring{fill:none;stroke:#f5c6d6;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.tail{pointer-events:none}
.bgstar{fill:#fff}
.twinkle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.sun-glow{animation:glow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{50%{opacity:.7;transform:scale(1.08)}}
body[data-view="space"] .ripple{stroke:#cfc8f3}
#confetti{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}

@media (max-width:700px){
  .tabs button{padding:6px 10px 6px 8px;font-size:13.5px}
  .brand h1{font-size:21px}
  .chip{font-size:13px;padding:6px 11px 6px 8px}
  .ask{font-size:24px}
  .card h2{font-size:26px}
  .flag{font-size:38px;width:60px;height:60px}
}
@media (prefers-reduced-motion:reduce){
  .card,.toast,.twinkle,.sun-glow{animation:none}
  .hint{animation-iteration-count:2}
}
</style>

<div id="app">
  <canvas id="confetti"></canvas>
  <div class="loading" id="loading">Unrolling the map…</div>

  <div class="top">
    <div class="brand panel">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#c6e3f2"/><path d="M8 15c4-3 7 0 9-2s5-3 7 0-1 6 2 8 6 1 5 5-5 6-8 5-3-4-6-4-6 3-8 0-1-6-1-8 0-3 0-4z" fill="#c5e8c8"/><path d="M27 9c2 0 4 1 4 3s-2 2-3 1-2-4-1-4z" fill="#fbdcae"/><circle cx="30" cy="27" r="2.5" fill="#f5c6d6"/></svg>
      <h1>Peeka<em>world</em></h1>
      <nav class="tabs" role="tablist" aria-label="Maps">
        <button role="tab" data-view="world" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="#c6e3f2"/><path d="M6 9c2-1.5 3.5 0 4.5-1s2.5-1.5 3.5 0-.5 3 1 4 3 .5 2.5 2.5-2.5 3-4 2.5-1.5-2-3-2-3 1.5-4 0-.5-3-.5-4z" fill="#c5e8c8"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="#36405a" stroke-width="1.5"/></svg>World</button>
        <button role="tab" data-view="usa" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="#fff" stroke="#36405a" stroke-width="1.5"/><path d="M3.8 9.5h16.4M3.8 13h16.4M3.8 16.3h16.4" stroke="#f2a3ba" stroke-width="1.6"/><rect x="3.8" y="6.3" width="7.4" height="6" rx="1" fill="#a9d0ec"/></svg>USA</button>
        <button role="tab" data-view="space" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5.5" fill="#f7e4b0" stroke="#36405a" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="10" ry="3.3" fill="none" stroke="#36405a" stroke-width="1.5" transform="rotate(-18 12 12)"/></svg>Space</button>
      </nav>
    </div>
    <div class="right">
      <div class="layers panel" role="group" aria-label="Map layers">
      </div>
      <button class="btn butter" id="playBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6L12 16.3l-5.4 3 1.3-6-4.6-4.1 6.1-.6z" fill="#fff" stroke="#36405a" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Find It!
      </button>
    </div>
  </div>

  <div class="zoom">
    <button id="zback" aria-label="Go back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5.5L4 12l6 6.5M4.8 12H20" fill="none" stroke="#36405a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#36405a" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="#36405a" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="zhome" aria-label="Show whole world"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#36405a" stroke-width="1.8"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17" fill="none" stroke="#36405a" stroke-width="1.6"/></svg></button>
  </div>

  <div class="game panel" id="game" hidden>
    <div class="modes" role="group" aria-label="Game level">
    </div>
    <div class="ask" id="ask"></div>
    <div class="gbar">
      <span class="stars" aria-label="Stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6L12 16.3l-5.4 3 1.3-6-4.6-4.1 6.1-.6z" fill="#fff" stroke="#36405a" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="gStars">0</span></span>
      <button class="btn" id="gHint">Hint</button>
      <button class="btn" id="gSkip">Skip</button>
      <button class="btn rose" id="gStop">Done</button>
    </div>
  </div>

  <div class="card panel" id="card" hidden>
    <button class="x" id="cClose" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="#36405a" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <p class="found" id="cFound" hidden></p>
    <div class="card-top">
      <div class="flag" id="cFlag"></div>
      <div style="min-width:0">
        <span class="kind" id="cKind"></span>
        <h2 id="cName"></h2>
      </div>
    </div>
    <dl class="rows" id="cRows"></dl>
    <p class="fact" id="cFact"><b>Did you know?</b><span></span></p>
    <div class="card-actions">
      <button class="btn butter" id="cSay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="#fff" stroke="#36405a" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 9c1.3 1.8 1.3 4.2 0 6M18 6.5c2.7 3.2 2.7 7.8 0 11" fill="none" stroke="#36405a" stroke-width="1.6" stroke-linecap="round"/></svg>Say it</button>
      <button class="btn" id="cZoom"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="#36405a" stroke-width="1.8"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5" stroke="#36405a" stroke-width="1.8" stroke-linecap="round"/></svg>Zoom in</button>
    </div>
  </div>
  <div class="toast panel" id="toast" hidden></div>
  <div class="tip" id="tip" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ---------------- DATA ---------------- */
const CONT = {
  NA:{name:'North America',color:'#c5e8c8',pos:[-102,47],fact:'Home to Canada, the United States, Mexico and lots of island countries in the Caribbean Sea.'},
  SA:{name:'South America',color:'#f9cdbb',pos:[-60,-14],fact:'The Andes here are the longest mountain range on land, and the Amazon River carries more water than any other river.'},
  EU:{name:'Europe',color:'#d8cdf2',pos:[22,55],fact:'Lots of countries are packed close together here. You can drive through five countries in one day!'},
  AF:{name:'Africa',color:'#fbdcae',pos:[20,6],fact:'Africa has 54 countries and the Sahara, the biggest hot desert in the world.'},
  AS:{name:'Asia',color:'#f6e9a3',pos:[92,46],fact:'The biggest continent. More than half of all the people on Earth live in Asia.'},
  OC:{name:'Australia',color:'#f5c6d6',pos:[134,-24],fact:'Australia is a continent and a country at the same time. Kangaroos and koalas live here.'},
  AN:{name:'Antarctica',color:'#fbfdff',pos:[30,-80],fact:'The coldest, windiest place on Earth. No country owns it, and only scientists live there for a while.'}
};

const OCEANS = {
  pacific:{name:'Pacific Ocean',big:true,pos:[[-150,2],[168,8]],fact:'The biggest and deepest ocean. It is bigger than all the land on Earth put together!'},

function hash(s){ let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

function largestPart(f, path){
  if (f.geometry.type !== 'MultiPolygon') return f;
  let best = null, ba = -1;
  for (const coords of f.geometry.coordinates){
    const g = {type:'Feature', geometry:{type:'Polygon', coordinates:coords}};
    const a = path.area(g); if (a > ba){ ba = a; best = g; }
  }
  return best;
}

function makeView(id, opts){
  const svg = d3.select('#app').insert('svg', '#confetti').attr('class','view').attr('id','v-' + id).attr('hidden','')
    .attr('role','img').attr('aria-label', opts.label);
  const v = Object.assign({id, svg, T:d3.zoomIdentity, k0:1, labels:[], history:[], layers:{}, layerDefs:[], maxZ:60, dirty:true}, opts);
  v.defs = svg.append('defs');
  v.bg = svg.append('g');
  v.root = svg.append('g');
  v.gLabels = svg.append('g');
  v.gFx = svg.append('g');
  v.zoom = d3.zoom().clickDistance(10).tapDistance(14)
    .on('zoom', e => { v.T = e.transform; v.root.attr('transform', v.T); scheduleLabels(v); });
  svg.call(v.zoom).on('dblclick.zoom', e => onDoubleTap(v, e));
  svg.on('click', e => { const it = itemFrom(e.target, e, v); if (it) select(it, e); });
  svg.on('pointermove', e => hover(v, e)).on('pointerleave', () => tip.hidden = true).on('pointerdown.tip', () => tip.hidden = true);
  views[id] = v;
  return v;
}
function itemFrom(el, e, v){
  for (; el && el !== v.svg.node(); el = el.parentNode){
    if (el.__item) return typeof el.__item === 'function' ? el.__item(e) : el.__item;
  }
  return null;
}
function homeT(v){
  const top = v.padTop ? $('.top').getBoundingClientRect().bottom + 8 : 0;
  const side = v.padSide ?? (v.padTop ? 76 : 0);
  const aw = W - side * 2, ah = H - top - (v.padTop ? 16 : 0);
  let k = Math.min(aw / v.BW, ah / v.BH);
  if (v.id === 'world') k = Math.max(Math.min(W / v.BW, H / v.BH), Math.min(W / v.BW, (H * .9) / v.BH));
  return d3.zoomIdentity.translate((W - v.BW * k) / 2, top + (ah - v.BH * k) / 2 + (v.id === 'world' ? 10 : 0)).scale(k);
}
function resize(v, first){
  const h = homeT(v); v.k0 = h.k;
  v.zoom.scaleExtent([v.k0 * (v.minZ || .8), v.k0 * v.maxZ]).translateExtent([[-v.BW * .4, -v.BH * .5], [v.BW * 1.4, v.BH * 1.5]]).extent([[0,0],[W,H]]);
  if (first) v.svg.call(v.zoom.transform, h); else v.svg.transition().duration(300).call(v.zoom.transform, h);
  if (v.onResize) v.onResize();
  v.dirty = false;
  measure(v);
}
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(() => {
  W = innerWidth; H = innerHeight;
  Object.values(views).forEach(v => v.dirty = true);
  if (active) resize(active, false);
  if (game.on) placeGame();
}, 150); });

function zoomToBounds(v, b, maxZ = 14){
  if (!b || !isFinite(b[0][0])) return;
  const dx = b[1][0] - b[0][0], dy = b[1][1] - b[0][1];
  const cx = (b[0][0] + b[1][0]) / 2, cy = (b[0][1] + b[1][1]) / 2;
  const k = Math.min(v.k0 * maxZ, Math.max(v.k0, .6 / Math.max(dx / W, dy / H)));
  v.svg.transition().duration(900).ease(d3.easeCubicInOut)
    .call(v.zoom.transform, d3.zoomIdentity.translate(W/2, H/2).scale(k).translate(-cx, -cy));
}
function zoomToPoint(v, p, z){
  if (!p) return;
  v.svg.transition().duration(900).ease(d3.easeCubicInOut)
    .call(v.zoom.transform, d3.zoomIdentity.translate(W/2, H/2).scale(v.k0 * Math.min(z, v.maxZ)).translate(-p[0], -p[1]));
}

/* view history, so Back returns to where you were */
function pushView(v){ v.history.push(v.T); if (v.history.length > 30) v.history.shift(); updateBack(); }
function updateBack(){ $('#zback').hidden = !(active && active.history.length); }
function goBack(){
  const v = active, t = v.history.pop(); updateBack();
  v.svg.transition().duration(700).ease(d3.easeCubicInOut).call(v.zoom.transform, t || homeT(v));
}
$('#zback').onclick = goBack;
$('#zin').onclick = () => active.svg.transition().duration(300).call(active.zoom.scaleBy, 1.8);
$('#zout').onclick = () => active.svg.transition().duration(300).call(active.zoom.scaleBy, 1/1.8);

addEventListener('keydown', e => {
  if (!active) return;
  if (e.key === 'Escape' || e.key === 'Backspace'){ if (active.history.length){ e.preventDefault(); goBack(); } }
  if (e.key === '+' || e.key === '=') $('#zin').onclick();
  if (e.key === '-') $('#zout').onclick();
});
addEventListener('mouseup', e => { if (e.button === 3 && active){ e.preventDefault(); goBack(); } });  // mouse "back" side button

let lastDbl = 0;
function onDoubleTap(v, e){
  const now = Date.now(); if (now - lastDbl < 450) return; lastDbl = now;
  if (e.cancelable) e.preventDefault();
  const pt = e.changedTouches ? e.changedTouches[0] : e;
  const el = document.elementFromPoint(pt.clientX, pt.clientY);
  const it = el && v.svg.node().contains(el) ? itemFrom(el, pt, v) : null;
  pushView(v);
  if (it){ focusItem(v, it); return; }
  const [mx, my] = d3.pointer(pt, v.svg.node());
  zoomToPoint(v, v.T.invert([mx, my]), v.T.k / v.k0 * 2.2);
}
function focusItem(v, it){
  if (v.onFocus) v.onFocus(it);
  const i = describe(it);
  i.bounds ? zoomToBounds(v, i.bounds) : zoomToPoint(v, i.point, Math.max(i.z, v.T.k / v.k0 * 1.5));
}

/* ---------------- LABELS ---------------- */
function addLabel(v, o){
  const g = v.gLabels.append('g').attr('class','lbl ' + o.cls + (o.item ? ' tap' : ''));
  if (o.marker) o.marker(g);
  if (o.flag){
    o.fimg = g.append('image').attr('href', `flags/${o.flag.toLowerCase()}.svg`).attr('width', 20).attr('height', 15).attr('y', -7.5).attr('preserveAspectRatio','xMidYMid slice');
    o.fbox = g.append('rect').attr('class','flag-edge').attr('width', 20).attr('height', 15).attr('y', -7.5).attr('rx', 2);
  }
  const t = g.append('text').text(o.text).attr('font-size', o.size).attr('dy','.35em');
  if (o.dx) t.attr('x', o.dx).attr('text-anchor','start'); else t.attr('text-anchor','middle');
  if (o.item) g.node().__item = o.item;
  o.g = g; o.t = t; o.w = o.text.length * o.size * .58; o.h = o.size * 1.2;
  v.labels.push(o);
  return o;
}
function measure(v){
  for (const o of v.labels){
    o.g.style('display', null); o.vis = undefined;
    try { const w = o.t.node().getComputedTextLength(); if (w) o.w = w; } catch(e){}
    o.tw = o.w; o.flagShown = undefined;
  }
  updateLabels(v);
}
function scheduleLabels(v){ if (!v.raf) v.raf = requestAnimationFrame(() => { v.raf = 0; updateLabels(v); }); }
function updateLabels(v){
  if (v !== active) return;
  const z = v.T.k / v.k0, placed = [];
  const hit = b => placed.some(p => b[0] < p[2] && b[2] > p[0] && b[1] < p[3] && b[3] > p[1]);
  for (const o of v.labels){
    if (o.fimg){
      const on = !!v.layers.flags;
      if (on !== o.flagShown){
        o.flagShown = on; o.w = (o.tw || o.w) + (on ? 24 : 0);
        o.t.attr('x', on ? 12 : 0);
        o.fimg.attr('x', -o.w / 2).style('display', on ? null : 'none');
        o.fbox.attr('x', -o.w / 2).style('display', on ? null : 'none');
      }
    }
    let show = (!o.layer || v.layers[o.layer]) && z >= (o.minZ || 0) && z < (o.maxZ || 1e9);
    if (show && o.span && o.w > o.span * v.T.k * 1.25 && !(o.forceZ && z >= o.forceZ)) show = false;
    let x, y;
    if (show){
      const p = o.pf ? o.pf() : o.p;
      if (!p) show = false;
      else { [x, y] = v.T.apply(p); if (o.dyf) y += o.dyf(v.T.k); if (x < -150 || x > W + 150 || y < -40 || y > H + 40) show = false; }
    }
    if (!show){ if (o.vis !== false){ o.g.style('display','none'); o.vis = false; } continue; }
    let showText = true;
    const b = o.dx ? [x + o.dx - 2, y - o.h/2, x + o.dx + o.w + 2, y + o.h/2] : [x - o.w/2 - 2, y - o.h/2, x + o.w/2 + 2, y + o.h/2];
    if (hit(b)){ if (!o.marker){ if (o.vis !== false){ o.g.style('display','none'); o.vis = false; } continue; } showText = false; }
    else placed.push(b);
    if (o.vis !== true){ o.g.style('display', null); o.vis = true; }
    o.g.attr('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    o.t.style('display', showText ? null : 'none');
  }
}

/* ---------------- HOVER (mouse) ---------------- */
function hover(v, e){
  if (e.pointerType !== 'mouse' || e.buttons){ tip.hidden = true; return; }
  const it = itemFrom(e.target, e, v);
  if (!it){ tip.hidden = true; return; }
  tip.textContent = nameOf(it); tip.hidden = false; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
}

/* ---------------- OCEAN LOOKUP ---------------- */
function oceanAt(lon, lat){
  if (lat > 66) return 'arctic';
  if (lat < -58) return 'southern';
  if (lat > 51 && lat < 64 && lon > -95 && lon < -76) return 'hudson';
  if (lon > 27 && lon < 42 && lat > 40.5 && lat < 47.5) return 'black';
  if (lon > 46 && lon < 55.5 && lat > 36 && lat < 47.5) return 'caspian';
  if (lon > -6 && lon < 37 && lat > 30 && lat < 46.5) return 'med';
  if (lon > 32 && lon < 44 && lat > 12 && lat < 30) return 'red';
  if (lon > -98 && lon < -81 && lat > 18 && lat < 31) return 'gulf';
  if (lon > -89 && lon < -60 && lat > 9 && lat < 22) return 'carib';
  if ((lat < 10 && lon > -70 && lon < 20) || (lat >= 10 && lat < 20 && lon > -88 && lon < 20) ||
      (lat >= 20 && lat < 31 && lon > -98 && lon < 20) || (lat >= 31 && lon > -100 && lon < 45)) return 'atlantic';
  if (lon >= 20 && lon < 147 && lat < 31 && !(lon >= 100 && lat > -8) && !(lon >= 130 && lat > -15)) return 'indian';
  return 'pacific';
}

function flashPath(g, d){

/* ---------------- USA VIEW ---------------- */
function buildUSA(us){

  Object.assign(v, {proj, path, BW:1000, BH:path.bounds(fc)[1][1] + 4});

  // give neighbouring states different pastel colors
  const geoms = us.objects.states.geometries, nb = topojson.neighbors(geoms), colorOf = {};
  geoms.forEach((g, i) => {
    const used = new Set(nb[i].map(j => colorOf[geoms[j].properties.name]));

    for (let s = 0; s < RAINBOW.length; s++){ const c = RAINBOW[(start + s) % RAINBOW.length]; if (!used.has(c)){ colorOf[g.properties.name] = c; break; } }
  });

  const SOV = {'Florida':[-81.7,28.3],'Michigan':[-84.6,43.6],'Louisiana':[-92.3,31]};

    const name = f.properties.name, lp = largestPart(f, path), b = path.bounds(lp);
    const s = {f, lp, name, ...STATES[name], center:SOV[name] ? proj(SOV[name]) : path.centroid(lp), span:b[1][0] - b[0][0],
               area:path.area(f), bounds:path.bounds(f), capPt:CAP_LL[name] && proj(CAP_LL[name])};

  v.states = states;

  v.layers = {names:true, capitals:true, cities:true};

  [...states].sort((a,b) => b.area - a.area).forEach((d, i) => addLabel(v, {cls:'usa-l', layer:'names', text:d.name, size:i < 12 ? 15 : 13,
    p:d.center, span:d.span, forceZ:4.5}));
  const capNames = new Set();
  states.filter(d => d.capPt && d.name !== 'District of Columbia').forEach(d => {
    capNames.add(d.cap);
    addLabel(v, {cls:'city cap-l', layer:'capitals', text:d.cap, size:11.5, dx:9, p:d.capPt, item:{type:'capital', d},
      marker: g => g.append('path').attr('d', d3.symbol(d3.symbolStar, 90)())});
  });
  CITIES.filter(c => c[5].includes('United States') && !capNames.has(c[0]) && c[0] !== 'Washington, D.C.').forEach(c => {
    const city = {name:c[0], pt:proj([c[1],c[2]]), where:c[5], fact:c[6], z:6};
    if (!city.pt) return;
    addLabel(v, {cls:'city', layer:'cities', text:city.name, size:12, dx:8, p:city.pt, minZ:c[3] === 3 ? 1.8 : 0,
      item:{type:'city', d:city}, marker: g => g.append('circle').attr('r', 4)});
  });
  const dc = states.find(d => d.name === 'District of Columbia');
  if (dc) addLabel(v, {cls:'city dc-l', layer:'capitals', text:'Washington, D.C.', size:12, dx:11, p:proj([-77.04,38.9]),
    item:{type:'state', d:dc}, marker: g => g.append('path').attr('d', d3.symbol(d3.symbolStar, 150)())});

  v.highlight = item => {
    gS.selectAll('.sel').classed('sel', false);
    if (item && (item.type === 'state' || item.type === 'capital')) gS.selectAll('path').filter(d => d === item.d).classed('sel', true).raise();
  };
  v.flash = t => {
    flashPath(gS, t.d);
    if (t.d.span * v.T.k < 12) zoomToBounds(v, t.d.bounds, 6);
  };
  v.game = {
    modes:[{id:'states', label:'States'}, {id:'capitals', label:'Capitals'}],
    pool: () => states.filter(d => d.name !== 'District of Columbia').map(d => ({type:'state', d})),
    ask: (t, mode) => mode === 'capitals'
      ? {flag:'', pre:'Which state has the capital ', name:t.d.cap, post:'?', speak:`Which state has the capital ${t.d.cap}?`}
      : {flag:'', pre:'Find ', name:t.d.name, post:'!', speak:`Can you find ${t.d.name}?`},
    match: (item, t) => (item.type === 'state' || item.type === 'capital') && item.d === t.d,
    wrong: (item, t, mode) => mode === 'capitals' && item.type === 'state' ? `That's ${item.d.name}. Its capital is ${item.d.cap}.` : null
  };
  return v;
}

/* ---------------- SPACE VIEW ---------------- */
function buildSpace(){
  const v = makeView('space', {label:'Interactive solar system', maxZ:30, minZ:.5, padTop:true, padSide:8, BW:SP.W, BH:SP.H});
  const {cx, cy, tilt} = SP, ra = SP.rot * Math.PI / 180, cos = Math.cos(ra), sin = Math.sin(ra);
  const offset = (dx, dy) => { const y = dy * tilt; return [dx * cos - y * sin, dx * sin + y * cos]; };
  const project = (dx, dy) => { const o = offset(dx, dy); return [cx + o[0], cy + o[1]]; };
  const plane = `translate(${cx},${cy}) rotate(${SP.rot}) scale(1,${tilt})`;
  v.layers = {names:true, orbits:true, moving:true, fast:false};
  v.layerDefs = [['names','Names','#c9b8f2','#ece6fb'], ['orbits','Orbits','#9fc0ec','#e3eefa'],
                 ['moving','Moving','#93d09b','#e6f5e8'], ['fast','Super fast','#f2a3ba','#fce6ed']];
  v.vt = 0;

  // painted Milky Way behind everything
  const gal = document.createElement('canvas'); gal.id = 'galaxy'; gal.setAttribute('aria-hidden','true');
  $('#app').insertBefore(gal, $('#app').firstChild);

  /* ---- gradients ---- */
  const radial = (id, stops, attrs = {}) => {
    const g = v.defs.append('radialGradient').attr('id', id);
    Object.entries(attrs).forEach(([k, val]) => g.attr(k, val));
    stops.forEach(([o, c, a = 1]) => g.append('stop').attr('offset', o).attr('stop-color', c).attr('stop-opacity', a));
    return g;
  };
  radial('sun-core', [['0%','#fffbe8'],['30%','#ffe596'],['70%','#ffb84a'],['100%','#ff8c3a']], {cx:'45%', cy:'42%', r:'60%'});
  radial('sun-glow', [['20%','#ffcf70',.6],['45%','#ff9a5a',.22],['100%','#ff6f7a',0]]);
  radial('sun-halo', [['0%','#ffd9a0',.16],['100%','#c27bff',0]]);
  radial('coma', [['0%','#ffffff',.9],['40%','#cdeaff',.35],['100%','#a9c8ff',0]]);
  BODIES.filter(b => !b.belt && b.id !== 'sun').forEach(b => {
    b.shadeGrad = radial('sh-' + b.id, [['0%','#ffffff',.38],['32%','#ffffff',0],['70%','#070620',.3],['100%','#070620',.82]], {r:'78%'});
    v.defs.append('clipPath').attr('id','clip-' + b.id).append('circle').attr('r', b.r);
  });

  const gOrbits = v.root.append('g').attr('class','orbits').attr('transform', plane);
  const gBelts = v.root.append('g');
  const gTails = v.root.append('g');
  const gBodies = v.root.append('g');

  // comets follow ellipses with the Sun at one focus (flat orbit-plane coordinates)
  function cometFlat(b, t){
    const {q, Q, tilt: w} = b.comet, a = (q + Q) / 2, e = (Q - q) / (Q + q), bb = a * Math.sqrt(1 - e * e);
    const M = 2 * Math.PI * (t / b.period + b.phase);
    let E = M; for (let i = 0; i < 8; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    const x = a * (Math.cos(E) - e), y = bb * Math.sin(E);
    return [x * Math.cos(w) - y * Math.sin(w), -(x * Math.sin(w) + y * Math.cos(w))];
  }
  BODIES.forEach(b => {
    if (b.orbit && !b.parent) gOrbits.append('circle').attr('class','orbit').attr('r', b.orbit);
    if (b.comet) gOrbits.append('path').attr('class','orbit comet').attr('d', d3.line()(d3.range(0, 1.0001, 1/200).map(f => cometFlat({...b, phase:0}, f * b.period))));
  });

  // asteroid belt and Kuiper belt: lots of specks lying in the tilted plane
  const rnd = d3.randomLcg(7);
  const belt = (r0, r1, n, colors, op) => {
    const g = gBelts.append('g');
    for (let i = 0; i < n; i++){
      const a = rnd() * Math.PI * 2, r = r0 + (r1 - r0) * (rnd() + rnd()) / 2;
      g.append('circle').attr('cx', r * Math.cos(a)).attr('cy', r * Math.sin(a)).attr('r', .7 + rnd() * 1.1)
        .attr('fill', colors[i % colors.length]).attr('opacity', op * (.45 + rnd() * .55));
    }
    return g;
  };
  const asteroidBelt = belt(170, 212, 420, ['#b9a794','#9d8e80','#d6c4ae'], .85);
  const kuiperBelt = belt(486, 560, 380, ['#9fb6ea','#c3cff5','#8fa2d8'], .55);
  asteroidBelt.node().__item = {type:'body', d:BODY.asteroids};
  kuiperBelt.node().__item = {type:'body', d:BODY.kuiper};

  /* ---- surface details, clipped to each planet ---- */
  const DECO = {
    earth: (g, r) => {
      g.append('path').attr('d', `M${-r*.55} ${-r*.5}c${r*.3} ${-r*.25} ${r*.6} 0 ${r*.55} ${r*.3}s${-r*.35} ${r*.3} ${-r*.3} ${r*.6} ${-r*.45} ${r*.1} ${-r*.4} ${-r*.2} ${-r*.05} ${-r*.5} ${r*.2} ${-r*.7}z`).attr('fill','#5aa865');
      g.append('path').attr('d', `M${r*.15} ${r*.15}c${r*.3} 0 ${r*.55} ${r*.2} ${r*.45} ${r*.45}s${-r*.4} ${r*.3} ${-r*.45} ${r*.05}z`).attr('fill','#6bb36f');
      g.append('ellipse').attr('cx', r*.2).attr('cy', -r*.25).attr('rx', r*.55).attr('ry', r*.12).attr('fill','#fff').attr('opacity',.55);
      g.append('ellipse').attr('cx', -r*.1).attr('cy', r*.6).attr('rx', r*.5).attr('ry', r*.1).attr('fill','#fff').attr('opacity',.45);
    },
    mars: (g, r) => {
      g.append('ellipse').attr('cy', -r*.92).attr('rx', r*.5).attr('ry', r*.22).attr('fill','#fbf1ea');
      g.append('ellipse').attr('cx', -r*.2).attr('cy', r*.1).attr('rx', r*.45).attr('ry', r*.18).attr('fill','#9c4128').attr('opacity',.55);
      g.append('ellipse').attr('cx', r*.35).attr('cy', r*.45).attr('rx', r*.3).attr('ry', r*.12).attr('fill','#a8492d').attr('opacity',.45);
    },
    venus: (g, r) => [-.4, 0, .35].forEach((y, i) => g.append('ellipse').attr('cy', y * r).attr('rx', r * 1.1).attr('ry', r * .14)
      .attr('fill', i % 2 ? '#f5e3b8' : '#d9b97f').attr('opacity', .6)),
    jupiter: (g, r) => {
      [[-.62,.12,'#b8875f'],[-.38,.1,'#efdcc1'],[-.18,.14,'#b07a52'],[.08,.12,'#efdcc1'],[.3,.14,'#bb8a62'],[.55,.1,'#e6cfae'],[.75,.1,'#b8875f']]
        .forEach(([y, h, c]) => g.append('rect').attr('x', -r).attr('y', y * r).attr('width', r * 2).attr('height', h * r).attr('fill', c).attr('opacity', .85));
      g.append('ellipse').attr('cx', r*.3).attr('cy', r*.37).attr('rx', r*.2).attr('ry', r*.11).attr('fill','#c0583a').attr('opacity',.9);
    },
    saturn: (g, r) => [[-.5,'#cfae72'],[-.15,'#ead6a6'],[.2,'#d2b37a'],[.5,'#ead6a6']].forEach(([y, c]) =>
      g.append('rect').attr('x', -r).attr('y', y * r).attr('width', r * 2).attr('height', r * .16).attr('fill', c).attr('opacity', .7)),
    neptune: (g, r) => {
      g.append('ellipse').attr('cx', -r*.25).attr('cy', r*.15).attr('rx', r*.28).attr('ry', r*.16).attr('fill','#22388f').attr('opacity',.8);
      g.append('ellipse').attr('cx', r*.1).attr('cy', -r*.35).attr('rx', r*.6).attr('ry', r*.07).attr('fill','#9db6f5').attr('opacity',.45);
    },

    craters: (g, r) => [[-.35,-.3,.22],[.3,.1,.18],[-.1,.45,.15],[.4,-.45,.12]].forEach(([x, y, s]) =>
      g.append('circle').attr('cx', x * r).attr('cy', y * r).attr('r', s * r).attr('fill','#000').attr('opacity', .16))
  };
  const ringEllipse = (g, r, half) => {
    const rings = [[2.25, .3, '#d9c49a', .85], [1.8, .2, '#b49c74', .75], [1.5, .1, '#e8d8b4', .6]];

    }

    b.g = g; b.inner = inner;
    if (b.comet){
      b.grad = v.defs.append('linearGradient').attr('id','tail-' + b.id).attr('gradientUnits','userSpaceOnUse');
      b.grad.append('stop').attr('offset','0%').attr('stop-color','#eaf6ff').attr('stop-opacity',.9);
      b.grad.append('stop').attr('offset','45%').attr('stop-color','#a9d4ff').attr('stop-opacity',.45);
      b.grad.append('stop').attr('offset','100%').attr('stop-color','#c49bff').attr('stop-opacity',0);
      b.tail = gTails.append('line').attr('class','tail').attr('stroke', `url(#tail-${b.id})`).attr('stroke-width', b.r * 2.4).attr('stroke-linecap','round');
    }
  });
  BODIES.forEach(b => b.pos = () => b.belt ? project(...b.flat) : pos[b.id]);
  const topLevel = BODIES.filter(b => !b.belt && !b.parent);
  let lastOrder = '';

  function shadeToward(b, p){
    if (!b.shadeGrad) return;
    let dx = cx - p[0], dy = cy - p[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const fx = (50 + 30 * dx).toFixed(1) + '%', fy = (50 + 30 * dy).toFixed(1) + '%';
    b.shadeGrad.attr('cx', fx).attr('cy', fy).attr('fx', fx).attr('fy', fy);
  }
  function place(){
    const t = v.vt / YEAR_S;
    BODIES.forEach(b => {
      if (b.belt) return;
      if (b.parent){
        const a = 2 * Math.PI * (v.vt / b.vperiod + hash(b.id) % 10 / 10);
        const lx = b.orbit * Math.cos(a), ly = -b.orbit * Math.sin(a), o = offset(lx, ly), pp = pos[b.parent];
        b.g.attr('transform', `translate(${o[0].toFixed(2)},${o[1].toFixed(2)})`);
        pos[b.id] = [pp[0] + o[0], pp[1] + o[1]];
        const behind = ly < 0; if (behind !== b.behind){ b.behind = behind; behind ? b.g.lower() : b.g.raise(); }
        shadeToward(b, pos[b.id]);

      else if (b.orbit){ const a = 2 * Math.PI * (t / b.period + b.phase); f = [b.orbit * Math.cos(a), -b.orbit * Math.sin(a)]; }
      const p = project(f[0], f[1]);
      flat[b.id] = f; pos[b.id] = p;
      b.g.attr('transform', `translate(${p[0].toFixed(2)},${p[1].toFixed(2)})`);
      if (b.id !== 'sun') b.inner.attr('transform', `scale(${(1 + .16 * f[1] / 560).toFixed(3)})`);   // a little smaller when far away
      shadeToward(b, p);
      if (b.comet){
        let dx = p[0] - cx, dy = p[1] - cy; const dist = Math.hypot(dx, dy) || 1, L = Math.min(80, 2600 / dist);
        const x2 = p[0] + dx / dist * L, y2 = p[1] + dy / dist * L;
        b.tail.attr('x1', p[0]).attr('y1', p[1]).attr('x2', x2).attr('y2', y2);
        b.grad.attr('x1', p[0]).attr('y1', p[1]).attr('x2', x2).attr('y2', y2);
      }
    });
    // things nearer to us are drawn on top, so planets pass in front of and behind the Sun
    const order = [...topLevel].sort((a, b) => flat[a.id][1] - flat[b.id][1]);
    const key = order.map(b => b.id).join();
    if (key !== lastOrder){ lastOrder = key; order.forEach(b => gBodies.node().appendChild(b.g.node())); }
    asteroidBelt.attr('transform', `${plane} rotate(${-(t / 4.5) * 360})`);
    kuiperBelt.attr('transform', `${plane} rotate(${-(t / 250) * 360})`);

  let last = 0;
  function frame(ts){

  v.onResize = () => {

  BODIES.forEach(b => {

    addLabel(v, {cls:b.belt ? 'belt-l' : 'space-l', layer:'names', text:b.label || b.name, size:b.belt ? 14 : small ? 11.5 : 14,
      pf:b.pos, dyf:b.belt ? null : k => b.r * k + 11, minZ:b.parent ? 4 : small && b.id !== 'pluto' ? 1.5 : 0, item:{type:'body', d:b}});
  });

  v.highlight = item => {
    gBodies.selectAll('.sel-ring').attr('hidden','');

  };
  v.flash = t => {
    const b = t.d, was = v.layers.moving;
    v.setMoving(false);
    const show = () => ringAt(v, v.T.apply(b.pos()));
    const [sx, sy] = v.T.apply(b.pos());
    if (sx < 0 || sx > W || sy < 0 || sy > H){ v.svg.transition().duration(700).call(v.zoom.transform, homeT(v)).on('end', show); } else show();
    setTimeout(() => { if (was) v.setMoving(true); }, 3500);
  };
  v.game = {
    modes:[{id:'space', label:'Space'}],
    pool: () => BODIES.filter(b => ['Planet','Star'].includes(b.kind) || b.id === 'moon' || b.id === 'pluto' || b.id === 'halley').map(d => ({type:'body', d})),
    ask: t => ({flag:bodyIcon(t.d), pre:t.d.the ? 'Find the ' : 'Find ', name:t.d.name, post:'!', speak:`Can you find ${t.d.the ? 'the ' : ''}${t.d.name}?`})
  };
  return v;
}

/* A painted Milky Way: deep indigo sky, soft nebula clouds, a glowing star band with a dark dust lane. */
function drawGalaxy(c){
  const dpr = Math.min(2, devicePixelRatio || 1);
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = Math.max(W, H), rnd = d3.randomLcg(42), gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
  const bg = x.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0c0a26'); bg.addColorStop(.5, '#16123d'); bg.addColorStop(1, '#090b22');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  const rgba = (hex, a) => { const c = d3.color(hex); c.opacity = a; return c + ''; };
  const blob = (bx, by, r, col, a) => {
    const g = x.createRadialGradient(bx, by, 0, bx, by, r);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g; x.fillRect(bx - r, by - r, r * 2, r * 2);
  };
  x.globalCompositeOperation = 'lighter';
  blob(W * .12, H * .18, R * .5, '#5a2a8f', .32);
  blob(W * .9, H * .85, R * .45, '#1d4f96', .32);
  blob(W * .78, H * .12, R * .3, '#8e2f78', .22);
  blob(W * .25, H * .9, R * .28, '#256d8c', .18);
  // the Milky Way band runs corner to corner
  const ax = -W * .1, ay = H * .92, bx = W * 1.1, by = H * .05;
  const nx = -(by - ay), ny = bx - ax, nl = Math.hypot(nx, ny);
  const along = t => [ax + (bx - ax) * t, ay + (by - ay) * t];
  const COLS = ['#a487e0','#e8a2c8','#86aef0','#f4dcc6','#c7b3ff'];
  for (let i = 0; i < 220; i++){
    const t = rnd(), [px, py] = along(t), o = gauss() * H * .09;
    blob(px + nx / nl * o, py + ny / nl * o, (.03 + .07 * rnd()) * R, COLS[i % COLS.length], .035 + .05 * rnd());
  }
  blob(...along(.55), R * .22, '#ffe7c8', .12);   // bright galactic core glow
  x.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 70; i++){                    // dark dust lane
    const t = .15 + rnd() * .75, [px, py] = along(t), o = (gauss() * .25 + .15) * H * .05;
    blob(px + nx / nl * o, py + ny / nl * o, (.02 + .04 * rnd()) * R, '#090820', .18);
  }
  x.globalCompositeOperation = 'lighter';
  const n = Math.round(W * H / 700);
  for (let i = 0; i < n; i++){
    let sx, sy;
    if (i % 2){ const t = rnd(), [px, py] = along(t), o = gauss() * H * .12; sx = px + nx / nl * o; sy = py + ny / nl * o; }
    else { sx = rnd() * W; sy = rnd() * H; }
    const s = rnd(), r = s < .9 ? .25 + rnd() * .5 : .7 + rnd() * .8;
    x.fillStyle = rgba(['#ffffff','#dfe8ff','#ffe9d6','#e9dcff'][i % 4], .35 + rnd() * .6);
    x.beginPath(); x.arc(sx, sy, r, 0, Math.PI * 2); x.fill();
  }
  for (let i = 0; i < 9; i++){                     // a few bright sparkly stars
    const sx = rnd() * W, sy = rnd() * H, r = 3 + rnd() * 5;
    blob(sx, sy, r, '#dfe8ff', .5);
    x.strokeStyle = 'rgba(230,236,255,.22)'; x.lineWidth = .5;
    x.beginPath(); x.moveTo(sx - r * 1.6, sy); x.lineTo(sx + r * 1.6, sy); x.moveTo(sx, sy - r * 1.6); x.lineTo(sx, sy + r * 1.6); x.stroke();
  }
  x.globalCompositeOperation = 'source-over';
}
function bodyIcon(b){
  if (b.belt) return `<svg viewBox="0 0 40 40">${[[12,14],[22,10],[30,18],[18,24],[27,28],[10,28],[20,17]].map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="${1.4 + i % 3}" fill="#b9a794"/>`).join('')}</svg>`;
  if (b.comet) return `<svg viewBox="0 0 40 40"><defs><linearGradient id="ic-t" x1="0" x2="1"><stop offset="0" stop-color="#eaf6ff"/><stop offset="1" stop-color="#c49bff" stop-opacity="0"/></linearGradient></defs><path d="M12 15 L36 6 L36 14 Z" fill="url(#ic-t)" transform="rotate(20 12 15)"/><circle cx="12" cy="18" r="5" fill="#eaf6ff"/></svg>`;
  const r = Math.max(7, Math.min(13, b.r * .8 + 5));

}

function sameThing(a, b){

  const cfg = active.game;
  if (!cfg.modes.some(m => m.id === game.mode)) game.mode = cfg.modes[0].id;
  game.on = true; closeCard(); renderModes(); $('#game').hidden = false; placeGame(); setStars(game.stars);
  if (active.T.k / active.k0 > 1.05) active.svg.transition().duration(600).call(active.zoom.transform, homeT(active));
  game.target = null; nextTarget();
}
function stopGame(){ game.on = false; $('#game').hidden = true; $('#toast').hidden = true; }
function nextTarget(){
  const p = active.game.pool(game.mode); let t;
  do { t = p[Math.floor(Math.random() * p.length)]; } while (game.target && p.length > 1 && sameThing(t, game.target));
  game.target = t; game.misses = 0;
  const a = active.game.ask(t, game.mode), ask = $('#ask');
  ask.innerHTML = '';
  if (a.flag){ const f = document.createElement('span'); f.className = 'gflag'; a.flag.startsWith('<') ? f.innerHTML = a.flag : f.textContent = a.flag; ask.append(f); }
  const b = document.createElement('b'); b.textContent = a.name;
  ask.append(a.pre, b, a.post);
  say(a.speak);
}
function checkAnswer(item){
  const t = game.target, cfg = active.game;
  const ok = cfg.match ? cfg.match(item, t, game.mode) : sameThing(item, t);
  if (ok){
    setStars(game.stars + 1);
    confetti(game.stars % 5 === 0 ? 260 : 120);
    const cheer = game.stars % 5 === 0 ? `Super explorer! ${game.stars} stars!` : ['You found it!','Great job!','Nice one!','Awesome!',"Yes, that's it!"][Math.floor(Math.random()*5)];
    say(`${cheer} ${describe(t).speak}!`);
    showCard(t, cheer);
    setTimeout(() => { if (game.on) nextTarget(); }, 1600);
  } else {
    game.misses++;
    const g = $('#game'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    const msg = (cfg.wrong && cfg.wrong(item, t, game.mode)) || `That's ${describe(item).speak}. Try again!`;
    toast(msg.charAt(0).toUpperCase() + msg.slice(1)); say(msg);
    if (game.misses === 3) hint();
  }
}
function hint(){ active.flash(game.target); say('Look for the flashing spot!'); }
$('#playBtn').onclick = startGame;
$('#gStop').onclick = stopGame;
$('#gSkip').onclick = () => { toast(`It was ${describe(game.target).speak}!`); hint(); setTimeout(() => { if (game.on) nextTarget(); }, 2000); };
$('#gHint').onclick = hint;

/* ---------------- CONFETTI ---------------- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], confettiRaf = 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n){
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  if (reduced) n = Math.min(n, 30);
  const cols = ['#f5b3c7','#fbd98a','#a9d6f0','#b5e2bb','#cbbcf0','#f9c2a8'];
  for (let i = 0; i < n; i++) parts.push({x:innerWidth/2 + (Math.random()-.5)*120, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-4,
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.4, s:6+Math.random()*7, c:cols[i % cols.length], life:0});
  if (!confettiRaf) tick();
}
function tick(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 20 && p.life < 240);
  for (const p of parts){
    p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); cx.restore();
  }
  confettiRaf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!parts.length) cx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ---------------- START ---------------- */
async function load(){
  const [world, us] = await Promise.all([
    fetch('data/countries.json').then(r => r.json()),
    fetch('data/states.json').then(r => r.json())
  ]);
  buildWorld(world); buildUSA(us); buildSpace();
  $('#loading').remove();
  const start = (location.hash || '').slice(1);
  setView(views[start] ? start : 'world');
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => measure(active));
}
load().catch(err => { $('#loading').textContent = 'The map could not load. Check the internet connection and refresh.'; console.error(err); });
